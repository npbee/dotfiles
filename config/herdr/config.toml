onboarding = false

[keys]
# Each worktree is a workspace, so jumping between them is the main navigation
# axis. herdr leaves all three of these unbound by default.
open_worktree = "prefix+shift+o"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

[worktrees]
directory = "~/.herdr/worktrees"

[ui]
# Worktree branches slug to ~26-char labels, and auto-scale sizes to the label
# without allowing for the indent it draws children under. Pin all three so the
# names aren't clipped by exactly that indent.
sidebar_width = 44
sidebar_min_width = 44
sidebar_max_width = 44

# Agents across worktrees run in parallel; surface whoever is blocked on input
# instead of keeping them pinned under their space.
agent_panel_sort = "priority"

hide_tab_bar_when_single_tab = true

[ui.sidebar.spaces]
# One repo, many sibling worktrees: separate the groups from unrelated spaces.
# Parents stay packed with their own children.
row_gap = 1
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

# Agents run one per worktree, so the workspace token is what tells the rows
# apart. The terminal title says what each one is actually doing.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace"], ["terminal_title_stripped"], ["agent", "state_text"]]
