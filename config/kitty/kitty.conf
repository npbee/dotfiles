# vim:fileencoding=utf-8:ft=conf:foldmethod=marker
#
# Only non-default settings live here. For the full option list with defaults:
#   kitty --debug-config
#   https://sw.kovidgoyal.net/kitty/conf/

include theme.conf

#: Fonts {{{

font_family      PragmataProMonoLiga-Regular
bold_font        PragmataProMonoLiga-Bold
italic_font      PragmataProMonoLiga-Italic
bold_italic_font PragmataProMonoLiga-BoldItalic

font_size 16.0

# Break ligatures only under the cursor, so editing inside `=>` or `!=` shows
# the real characters.
disable_ligatures cursor

# Nerd Font glyph ranges PragmataPro doesn't cover.
symbol_map U+e000-U+e00a,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b1,U+e700-U+e7c5,U+ea60-U+ebeb,U+ed00-U+efc1,U+f000-U+f2ff,U+f300-U+f372,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

#: }}}

#: Cursor {{{

# Unfocused splits get a hollow cursor; combined with inactive_text_alpha this
# makes the focused window obvious without reading borders.
cursor_shape_unfocused hollow

#: }}}

#: Scrollback {{{

scrollback_lines 20000
scrollback_pager_history_size 128

#: }}}

#: Mouse {{{

mouse_hide_wait 0
underline_hyperlinks hover

#: }}}

#: Bell {{{

enable_audio_bell no
visual_bell_duration 0.1 ease-in-out
visual_bell_color #789B8D

# Notify when a slow command finishes somewhere you aren't looking.
notify_on_cmd_finish unfocused 10.0

#: }}}

#: Window layout {{{

window_padding_width 8 10
inactive_text_alpha 0.85

enabled_layouts splits:split_axis=horizontal,stack

#: }}}

#: Tab bar {{{

tab_bar_style powerline
tab_powerline_style round
tab_bar_margin_width 1.0
tab_bar_margin_height 0 2
tab_title_max_length 24
active_tab_font_style bold
inactive_tab_font_style normal

tab_title_template "{index}: {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"

# Both symbols are empty by default, which makes the slots above render nothing.
tab_activity_symbol "󰄰 "
bell_on_tab "󰂚 "

#: }}}

#: macOS {{{

macos_titlebar_color background
macos_option_as_alt left
confirm_os_window_close 0

# Reclaims the titlebar row, at the cost of the traffic-light buttons.
# hide_window_decorations titlebar-only

#: }}}

#: Remote control {{{

# socket-only keeps a program on the other end of an ssh session from driving
# this terminal; the pid suffix stops concurrent instances sharing one socket.
allow_remote_control socket-only
listen_on unix:/tmp/mykitty-{kitty_pid}

#: }}}

#: Keyboard shortcuts {{{

kitty_mod cmd

# Scrollback
map cmd+f show_scrollback

# Shell-integration prompt navigation
map cmd+up   scroll_to_prompt -1
map cmd+down scroll_to_prompt 1
map cmd+g    show_last_command_output

# Splits
map cmd+d       launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+enter   next_layout
map cmd+alt+left  neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up    neighboring_window up
map cmd+alt+down  neighboring_window down

# Tabs
map cmd+t       new_tab_with_cwd
map cmd+shift+. move_tab_forward
map cmd+shift+, move_tab_backward
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5

# Hints
map cmd+e kitten hints

#: }}}
